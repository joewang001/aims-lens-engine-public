  include_contracts_only_by_default: true
  allowed_now:
    - api/openapi.yaml
    - schemas/jobace_adapter_contract.schema.json
    - examples/lens-workspace-create-api-key-request.json
    - examples/lens-workspace-create-tenant-request.json
    - examples/lens-workspace-source-material-request.json
  deferred_until_mock_adapter_review:
    - services/lens_workspace_api/
    - services/lens_workspace_ui/

required_pre_export_checks:
  - path_exists_for_all_existing_candidates
  - no_private_manifest_path_in_export
  - no_private_only_evidence
  - no_raw_private_source_text
  - no_candidate_or_resume_data
  - no_user_submitted_job_posting_bodies
  - no_api_keys_or_tokens
  - no_local_database_paths
  - no_production_deployment_config
  - schema_validation_for_exported_lenses
  - seven_dimension_lens_coverage_validation
  - manual_company_lens_audit
