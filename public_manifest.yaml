# Public export allowlist for AIMS Lens Engine.
#
# This manifest defines what may be copied into a public release tree.
# It is intentionally conservative: export tooling should copy only paths
# listed here, then apply private_manifest.yaml as a hard denylist.

version: 1
status: public_released
release_name: aims-lens-engine-public-core
export_root: dist/public/aims-lens-engine

policy:
  default_action: deny
  copy_only_allowlisted_paths: true
  apply_private_manifest_after_allowlist: true
  require_manual_review_before_public_push: true
  raw_private_materials_allowed: false
  private_distillation_public_safe_allowed: true
  reject_private_only_evidence: true

licenses:
  code: Apache-2.0
  content: CC-BY-4.0
  private: proprietary-jobace-internal

public_evidence_visibility:
  allowed:
    - public_source
    - public_community_aggregate
    - private_distillation_public_safe
  blocked:
    - private_only

initial_public_release:
  minimum_company_lens_count: 12
  replacement_policy: replace_blocked_candidates_rather_than_shrink_below_10
  company_lenses:
