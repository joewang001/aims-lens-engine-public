name: Public Agent Distribution
on:
  pull_request:
    paths: ['agent-access/**', 'tools/package_agent_access.py', 'tests/test_agent_distribution.py', 'public_manifest.yaml', 'tools/scan_public_export.py', '.github/workflows/agent-distribution.yml']
  push:
    branches: [main]
    paths: ['agent-access/**', 'tools/package_agent_access.py', 'tests/test_agent_distribution.py']
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML
      - run: python tools/package_agent_access.py --check
      - run: python -m unittest tests.test_agent_distribution -v
      - run: python tools/scan_public_export.py --allowlist
