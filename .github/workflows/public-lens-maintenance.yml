name: Public Lens Maintenance

on:
  pull_request:
  push:
    branches:
      - main
      - automation/public-lens-source-agent
  schedule:
    - cron: "0 13 * * 1"
    - cron: "0 13 * * 0,2-6"
  workflow_dispatch:
    inputs:
      mode:
        description: Maintenance mode
        required: true
        default: weekly-expansion
        type: choice
        options:
          - weekly-expansion
          - daily-enrichment
          - validate-only

permissions:
  contents: write
  pull-requests: write

env:
  PYTHONDONTWRITEBYTECODE: "1"
  WEEKLY_NEW_COMPANY_TARGET: "2"
  DAILY_HISTORICAL_COMPANY_TARGET: "2"

jobs:
  validate-public-lens:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install pyyaml

      - name: Compile tools
        run: |
          python -m py_compile \
            tools/scan_public_export.py \
            tools/generate_public_release_audit_report.py \
            tools/validate_public_lens_coverage.py \
            tools/prepare_public_lens_refresh.py \
            tools/collect_public_lens_sources.py \
            tools/generate_public_lens_patch.py \
            tools/public_lens_operations.py \
            tools/publish_public_lens.py

      - name: Run unit tests before any automated merge
        run: python -m unittest discover -s tests -v

      - name: Scan public boundary
        run: python tools/scan_public_export.py --allowlist

      - name: Validate company lens coverage
        run: python tools/validate_public_lens_coverage.py --min-companies 12

  weekly-company-expansion:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 13 * * 1') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'weekly-expansion')
    needs: validate-public-lens
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install pyyaml

      - name: Add only the missing weekly cohort (idempotent)
        run: python tools/run_weekly_public_lens_expansion.py --target "$WEEKLY_NEW_COMPANY_TARGET" --reserve 8

      - name: Build operations reports
        run: |
          python tools/prepare_public_lens_refresh.py
          python tools/public_lens_operations.py audit-gaps --catalog-reserve-target 8
          python tools/public_lens_operations.py verify-reserve --min-unused 8

      - name: Validate generated expansion
        run: |
          python tools/scan_public_export.py --allowlist
          python tools/validate_public_lens_coverage.py --min-companies 12

      - name: Create weekly expansion pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/public-lens-weekly-expansion
          delete-branch: true
          commit-message: Add weekly public company lens cohort
          title: "Add weekly public company lens cohort"
          body: |
            Automated Monday public-lens expansion PR.

            Hard acceptance metric:
            - at least 2 new `LIGHTWEIGHT_SCAN` company lenses;
            - public boundary scan passes;
            - seven-dimension coverage validator has zero blockers;
            - unresolved depth gaps are recorded with reasons and next actions.

            This PR uses only approved public-source catalog entries. It does
            not add private material, candidate or tenant data, copied job
            posting bodies, paywalled text, secrets, or production config.
          labels: |
            automated-refresh
            weekly-company-expansion
            public-safe-candidate
            auto-merge-eligible

      - name: Enable auto-merge when eligible
        if: steps.cpr.outputs.pull-request-number != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --squash --auto --delete-branch

  open-sourcing-agent-pull-request:
    if: github.event_name == 'push' && github.ref == 'refs/heads/automation/public-lens-source-agent'
    needs: validate-public-lens
    runs-on: ubuntu-latest
    steps:
      - name: Open or update the sourcing-agent pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/public-lens-source-agent
        run: |
          number=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$BRANCH" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --head "$BRANCH" \
              --base main \
              --title "Advance daily public lens sourcing" \
              --body "Public-source updates submitted from the NAS. The exact pushed commit passed unit tests, public-boundary scan and coverage checks before this PR was opened. Gap counts and merged provenance must be verified on main."
            number=$(gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --head "$BRANCH" \
              --base main \
              --state open \
              --json number \
              --jq '.[0].number')
          fi
          gh pr edit "$number" \
            --repo "$GITHUB_REPOSITORY" \
            --add-label automated-refresh,daily-lens-enrichment,public-safe-candidate,auto-merge-eligible || true
          ready=false
          for attempt in $(seq 1 12); do
            mergeable=$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json mergeable --jq '.mergeable')
            case "$mergeable" in
              MERGEABLE) ready=true; break ;;
              CONFLICTING) echo "PR has conflicts; preserving it for review" >&2; exit 1 ;;
              *) sleep 5 ;;
            esac
          done
          if [ "$ready" != true ]; then
            echo "PR mergeability is still unknown; preserving it for review" >&2
            exit 1
          fi
          # All validation completed in needs; the server still enforces branch rules.
          gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$GITHUB_SHA"

  daily-seven-dimension-enrichment:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 13 * * 0,2-6') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'daily-enrichment')
    needs: validate-public-lens
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install pyyaml

      - name: Apply available source packets to existing lenses
        run: python tools/generate_public_lens_patch.py --existing-limit 1000 --execute --allow-empty

      - name: Build daily work plan and information-gap register
        run: |
          python tools/public_lens_operations.py audit-gaps --catalog-reserve-target 8
          python tools/public_lens_operations.py plan-daily \
            --weekday auto \
            --weekly-cohort-limit "$WEEKLY_NEW_COMPANY_TARGET" \
            --historical-limit "$DAILY_HISTORICAL_COMPANY_TARGET" \
            --catalog-reserve-target 8
          python tools/prepare_public_lens_refresh.py

      - name: Validate daily update
        run: |
          python tools/scan_public_export.py --allowlist
          python tools/validate_public_lens_coverage.py --min-companies 12

      - name: Create daily enrichment pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/public-lens-daily-enrichment
          delete-branch: true
          commit-message: Advance daily public lens enrichment
          title: "Advance daily public lens enrichment"
          body: |
            Automated Tuesday-through-Sunday seven-dimension maintenance PR.

            The daily plan prioritizes this week's new companies and also
            assigns historical lenses with the highest unresolved gaps. Source
            packets supplied by the downstream sourcing team are applied before
            validation. Unsupported information remains explicitly recorded in
            the information-gap register instead of being invented.
          labels: |
            automated-refresh
            daily-lens-enrichment
            public-safe-candidate
            auto-merge-eligible

      - name: Enable auto-merge when eligible
        if: steps.cpr.outputs.pull-request-number != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --squash --auto --delete-branch
