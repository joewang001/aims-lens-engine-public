name: Public Lens Validation

# Public is a curated demonstration, not the canonical company catalog.
# All routine company expansion and enrichment must target Private first.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  validate-public-lens:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install pyyaml

      - name: Compile tools
        run: |
          python -m py_compile \
            tools/scan_public_export.py \
            tools/generate_public_release_audit_report.py \
            tools/validate_public_lens_coverage.py \
            tools/prepare_public_lens_refresh.py \
            tools/collect_public_lens_sources.py \
            tools/generate_public_lens_patch.py \
            tools/public_lens_operations.py \
            tools/publish_public_lens.py

      - name: Run unit tests before any automated merge
        run: python -m unittest discover -s tests -v

      - name: Scan public boundary
        run: python tools/scan_public_export.py --allowlist

      - name: Validate company lens coverage
        run: python tools/validate_public_lens_coverage.py --min-companies 12
